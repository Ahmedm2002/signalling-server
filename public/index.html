<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebRTC DataChannel Demo</title>
  </head>
  <body>
    <h2>WebRTC P2P DataChannel</h2>

    <div id="onBoarding">
      <input id="userName" placeholder="Name" />
      <input id="userEmail" placeholder="Email" />
      <button onclick="saveEmail()">Save</button>
    </div>

    <div id="message"></div>

    <div id="connectFriend" style="display: none">
      <input id="friendEmail" placeholder="Friend Email" />
      <button onclick="connectFriend()">Connect</button>
    </div>

    <hr />

    <div id="chat" style="display: none">
      <h3>Status: <span id="status">DISCONNECTED</span></h3>

      <input id="textMsg" placeholder="Message" />
      <button onclick="sendText()">Send Text</button>

      <br /><br />
      <input type="file" id="fileInput" />
      <button onclick="sendFile()">Send File</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
